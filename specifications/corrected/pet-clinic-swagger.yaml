definitions:
  ProblemDetail:
    type: object
    description: The schema for all error responses.
    title: Problem Detail
    required:
      - type
      - title
      - status
      - detail
      - timestamp
      - schemaValidationErrors
    properties:
      type:
        type: string
        description: Full URL that originated the error response.
        format: uri
        title: Type
        example: http://localhost:9966/petclinic/api/owner
      title:
        type: string
        description: The short error title.
        title: Title
        example: NoResourceFoundException
      status:
        type: integer
        description: HTTP status code
        format: int32
        title: Status
        maximum: 600
        exclusiveMaximum: true
        minimum: 400
        example: 500
      detail:
        type: string
        description: The long error message.
        title: Detail
        example: No static resource api/owner.
      timestamp:
        type: string
        description: The time the error occurred.
        format: date-time
        title: Timestamp
        example: "2024-11-23T13:59:21.3820407Z"
      schemaValidationErrors:
        type: array
        description: Validation errors against the OpenAPI schema.
        title: Schema validation errors
        items:
          $ref: '#/definitions/ValidationMessage'
  ValidationMessage:
    type: object
    description: Messages describing a validation error.
    title: Validation message
    required:
      - message
    properties:
      message:
        type: string
        description: The validation message.
        title: Message
        example: '[Path ''/lastName''] Instance type (null) does not match any allowed primitive type (allowed: [''string''])'
  Specialty:
    type: object
    description: Fields of specialty of vets.
    title: Specialty
    required:
      - id
      - name
    properties:
      id:
        type: integer
        description: The ID of the specialty.
        format: int32
        title: ID
        minimum: 0
        example: 1
      name:
        type: string
        description: The name of the specialty.
        title: Name
        maxLength: 80
        minLength: 1
        example: radiology
  OwnerFields:
    type: object
    description: Editable fields of a pet owner.
    title: Owner fields
    required:
      - firstName
      - lastName
      - address
      - city
      - telephone
    properties:
      firstName:
        type: string
        description: The first name of the pet owner.
        title: First name
        maxLength: 30
        minLength: 1
        pattern: ^[\p{L}]+([ '-][\p{L}]+){0,2}$
        example: George
      lastName:
        type: string
        description: The last name of the pet owner.
        title: Last name
        maxLength: 30
        minLength: 1
        pattern: ^[\p{L}]+([ '-][\p{L}]+){0,2}\.?$
        example: Franklin
      address:
        type: string
        description: The postal address of the pet owner.
        title: Address
        maxLength: 255
        minLength: 1
        example: 110 W. Liberty St.
      city:
        type: string
        description: The city of the pet owner.
        title: City
        maxLength: 80
        minLength: 1
        example: Madison
      telephone:
        type: string
        description: The telephone number of the pet owner.
        title: Telephone number
        maxLength: 20
        minLength: 1
        pattern: ^[0-9]*$
        example: "6085551023"
  Owner:
    description: A pet owner.
    title: Owner
    allOf:
      - $ref: '#/definitions/OwnerFields'
      - type: object
        required:
          - pets
        properties:
          id:
            type: integer
            description: The ID of the pet owner.
            format: int32
            title: ID
            minimum: 0
            readOnly: true
            example: 1
          pets:
            type: array
            description: The pets owned by this individual including any booked vet visits.
            title: Pets
            items:
              $ref: '#/definitions/Pet'
  PetFields:
    type: object
    description: Editable fields of a pet.
    title: Pet fields
    required:
      - name
      - birthDate
      - type
    properties:
      name:
        type: string
        description: The name of the pet.
        title: Name
        maxLength: 30
        example: Leo
      birthDate:
        type: string
        description: The date of birth of the pet.
        format: date
        title: Birth date
        example: "2010-09-07"
      type:
        $ref: '#/definitions/PetType'
  Pet:
    description: A pet.
    title: Pet
    allOf:
      - $ref: '#/definitions/PetFields'
      - type: object
        required:
          - id
          - type
          - visits
        properties:
          id:
            type: integer
            description: The ID of the pet.
            format: int32
            title: ID
            minimum: 0
            example: 1
          ownerId:
            type: integer
            description: The ID of the pet's owner.
            format: int32
            title: Owner ID
            minimum: 0
            readOnly: true
            example: 1
          visits:
            type: array
            description: Vet visit bookings for this pet.
            title: Visits
            items:
              $ref: '#/definitions/Visit'
  VetFields:
    type: object
    description: Editable fields of a veterinarian.
    title: VetFields
    required:
      - firstName
      - lastName
      - specialties
    properties:
      firstName:
        type: string
        description: The first name of the vet.
        title: First name
        maxLength: 30
        minLength: 1
        pattern: ^[\p{L}]+([ '-][\p{L}]+){0,2}$
        example: James
      lastName:
        type: string
        description: The last name of the vet.
        title: Last name
        maxLength: 30
        minLength: 1
        pattern: ^[\p{L}]+([ '-][\p{L}]+){0,2}\.?$
        example: Carter
      specialties:
        type: array
        description: The specialties of the vet.
        title: Specialties
        items:
          $ref: '#/definitions/Specialty'
  Vet:
    description: A veterinarian.
    title: Vet
    required:
      - id
      - firstName
      - lastName
      - specialties
    allOf:
      - $ref: '#/definitions/VetFields'
      - type: object
        properties:
          id:
            type: integer
            description: The ID of the vet.
            format: int32
            title: ID
            minimum: 0
            readOnly: true
            example: 1
  VisitFields:
    type: object
    description: Editable fields of a vet visit.
    title: Visit fields
    required:
      - description
    properties:
      date:
        type: string
        description: The date of the visit.
        format: date
        title: Date
        example: "2013-01-01"
      description:
        type: string
        description: The description for the visit.
        title: Description
        maxLength: 255
        minLength: 1
        example: rabies shot
  Visit:
    description: A booking for a vet visit.
    title: Visit
    allOf:
      - $ref: '#/definitions/VisitFields'
      - type: object
        required:
          - id
          - petId
        properties:
          id:
            type: integer
            description: The ID of the visit.
            format: int32
            title: ID
            minimum: 0
            example: 1
          petId:
            type: integer
            description: The ID of the pet.
            format: int32
            title: Pet ID
            minimum: 0
            example: 1
  PetTypeFields:
    type: object
    description: Editable fields of a pet type.
    title: PetType fields
    required:
      - name
    properties:
      name:
        type: string
        description: The name of the pet type.
        title: Name
        maxLength: 80
        minLength: 1
        example: cat
  PetType:
    description: A pet type.
    title: Pet type
    allOf:
      - $ref: '#/definitions/PetTypeFields'
      - type: object
        required:
          - id
        properties:
          id:
            type: integer
            description: The ID of the pet type.
            format: int32
            title: ID
            minimum: 0
            example: 1
  User:
    type: object
    description: An user.
    title: User
    required:
      - username
    properties:
      username:
        type: string
        description: The username
        title: username
        maxLength: 80
        minLength: 1
        example: john.doe
      password:
        type: string
        description: The password
        title: Password
        maxLength: 80
        minLength: 1
        example: 1234abc
      enabled:
        type: boolean
        description: Indicates if the user is enabled
        title: enabled
        example: true
      roles:
        type: array
        description: The roles of an user
        title: Roles
        items:
          $ref: '#/definitions/Role'
  Role:
    type: object
    description: A role.
    title: Role
    required:
      - name
    properties:
      name:
        type: string
        description: The role's name
        title: name
        maxLength: 80
        minLength: 1
        example: admin
