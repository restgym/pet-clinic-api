# RESTgym API manifest
manifest_version: 1

id: pet-clinic
name: Spring PetClinic REST
version: "3.4.3"                  # Implementation-Version of spring-petclinic-rest.jar
description: REST version of the Spring PetClinic sample application (veterinary clinic).
domain: healthcare
license: Apache-2.0
repository: https://github.com/spring-petclinic/spring-petclinic-rest
technology:
  language: java
  framework: Spring Boot          # 3.5.7
  database: H2                    # in-memory; schema and sample data loaded at each start (db/h2/*.sql of the original repository)

original_specification:           # OpenAPI 3.0.1, written by the authors (the code is generated from it): src/main/resources/openapi.yml at commit 8409c0a (version 3.4.3)
  version: "3.0"
  format: yaml
  origin: manual
  created_by: Spring PetClinic developers
  file: original/pet-clinic-openapi.yaml
  source: https://github.com/spring-petclinic/spring-petclinic-rest/blob/8409c0a7361a56b5526ae2fd2f60f723c6e3d30a/src/main/resources/openapi.yml

authentication: none

# Errors are JSON: {type, title, status, detail, instance, timestamp} (the title is the exception), without detail
# for some exceptions (e.g., NullPointerException: the endpoint is kept instead), or the default errors of Spring
# {timestamp, status, error, path}. Only the values sent by the tools repeated in the messages of Spring and Jackson
# are replaced (inputs, quoted content types and mime types, the characters, tokens, escapes and bytes of invalid JSON,
# true and false, dates, numbers, the URL of a request with no endpoint): any other difference, such as the type of
# the value sent, the structure of invalid JSON, the request method or a missing Content-Type, makes a different
# failure.
# Threshold: just above the highest similarity between two different failures in the runs of rest-league-2027-official,
# 0.938 (an invalid value of two fields of a date, e.g., MinuteOfHour or MonthOfYear)
server_errors:
  similarity_threshold: 0.94
  preprocessing:
    - json_fields: {fields: [title, detail], separator: ' ', min_length: 5}
    - json_fields: {fields: [title, instance], separator: ' ', min_length: 5}
    - json_fields: {fields: [error, path], separator: ' ', min_length: 5}
    - replace: {pattern: '(?s)No static resource .*', with: 'No static resource <value>'}
    - replace: {pattern: 'Content-Type ''[^'']*'' is not supported', with: 'Content-Type <value> is not supported'}
    - replace: {pattern: '(?s)Invalid mime type ".*?"(?=: )', with: 'Invalid mime type <value>'}
    - replace: {pattern: '(unsupported charset) ''[^'']*''', with: '\1 <value>'}
    - replace: {pattern: '(?s)For input string: .*', with: 'For input string: <value>'}
    - replace: {pattern: '(?s)(from String) ".*?"(?=: (?:not a valid|Failed to deserialize|only "true" or "false"|not one of the values|not a valid representation|Overflow))', with: '\1 <value>'}
    - replace: {pattern: '(?s)(Overflow: numeric value) \(.*?\)(?= out of range)', with: '\1 <value>'}
    - replace: {pattern: '(?s)(from String value) \(''.*?''\)', with: '\1 (<value>)'}
    - replace: {pattern: '(?s)Text ''.*?'' could not be parsed', with: 'Text <value> could not be parsed'}
    - replace: {pattern: '(?s)(deserialize from [\w-]+ value) \(.*\)$', with: '\1 (<value>)'}
    - replace: {pattern: '\bVALUE_(?:TRUE|FALSE)\b', with: 'VALUE_<value>'}
    - replace: {pattern: '(?s)((?:Unexpected|Illegal(?: unquoted)?) character) \((?:''.{1,2}?'' \(code \d+(?: / 0x[0-9a-fA-F]+)?\)|\(CTRL-CHAR, code \d+\))\)', with: '\1 <value>'}
    - replace: {pattern: 'Non-standard token ''[^'']*''', with: 'Non-standard token <value>'}
    - replace: {pattern: '(?s)Unrecognized token ''.*?''(?=: was expecting)', with: 'Unrecognized token <value>'}
    - replace: {pattern: '(Invalid UTF-\d+ \w+ byte) 0x[0-9a-fA-F]+', with: '\1 <value>'}
    - replace: {pattern: '(?s)Numeric value \(.*?\) out of range', with: 'Numeric value <value> out of range'}
    - replace: {pattern: '(?s)Unrecognized character escape ''.{1,2}?'' \(code \d+\)', with: 'Unrecognized character escape <value>'}
    - replace: {pattern: '(?s)Invalid date ''[^'']*''', with: 'Invalid date <value>'}
    - mask: [numbers]
    - replace: {pattern: '-<number>', with: '<number>'}
